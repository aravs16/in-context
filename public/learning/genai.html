<style>
  :root {
    --paper:   #f1ede2;
    --paper-2: #eae4d6;
    --card:    #fbf9f2;
    --ink:     #1c1813;
    --ink-2:   #57503f;
    --ink-3:   #8c8472;
    --line:    #ddd5c3;
    --line-2:  #cfc6b1;
    --accent:  #c2552b;
    --accent-2:#a8431f;
    --accent-tint: #f4e3d6;
    --shadow: 0 1px 0 #fffefb inset, 0 2px 4px rgba(40,30,15,.05), 0 12px 28px -16px rgba(60,40,20,.18);
    --sans: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    background-image:
      radial-gradient(var(--line-2) 0.6px, transparent 0.6px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  body.modal-open { overflow: hidden; }
  ::selection { background: var(--accent-tint); }

  .mono { font-family: var(--mono); }

  .page { max-width: 1180px; margin: 0 auto; padding: 44px 28px 70px; }

  /* ---------- header actions row (how-to + view toggle) ---------- */
  .hdr-actions { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .howto-btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12.5px; color: var(--ink-2);
    font-family: var(--mono); font-weight: 600;
    letter-spacing: .03em;
    cursor: pointer;
    transition: all .15s;
  }
  .howto-btn:hover {
    border-color: var(--accent);
    color: var(--accent-2);
    background: var(--accent-tint);
  }
  .howto-btn svg { width: 13px; height: 13px; }

  /* ---------- top back link to In Context ---------- */
  .topback {
    display: inline-flex; align-items: center; gap: 8px;
    text-decoration: none;
    color: var(--ink-3); font-size: 13.5px; font-weight: 600;
    letter-spacing: .02em; margin-bottom: 18px;
    transition: color .15s ease;
    font-family: var(--mono);
  }
  .topback:hover { color: var(--accent); }
  .topback svg { width: 11px; height: 11px; }

  /* ---------- header (flat editorial layout) ---------- */
  .hdr { padding-top: 6px; }

  .eyebrow-row {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 30px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .18em;
    color: var(--ink-3);
    white-space: nowrap;
    text-transform: uppercase;
  }
  .eyebrow-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
    flex-shrink: 0;
  }
  .eyebrow-rule {
    flex: 1;
    height: 1px;
    background: var(--line-2);
    min-width: 24px;
  }

  .title-block {
    margin: 0 0 30px;
    font-weight: 700;
    font-family: var(--sans);
    line-height: 1;
  }
  .title-line {
    display: block;
    font-size: clamp(46px, 9vw, 96px);
    line-height: 1.02;
    letter-spacing: -0.04em;
    margin: 0;
    color: var(--ink);
  }
  .title-line.alt { color: var(--accent); }

  .title-badges {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 0 0 30px;
  }
  .title-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .14em;
    color: var(--accent-2);
    background: var(--accent-tint);
    border: 1px solid #e9cdba;
    border-radius: 7px;
    padding: 6px 11px;
    white-space: nowrap;
  }
  .title-badge i {
    font-size: 16px;
    line-height: 1;
    color: var(--accent);
  }

  .lede {
    font-family: var(--mono);
    font-size: 16px;
    line-height: 1.65;
    color: var(--ink-2);
    max-width: 62ch;
    margin: 0 0 38px;
    text-wrap: pretty;
  }

  .hdr-rule {
    height: 1px;
    background: var(--line-2);
    margin: 0 0 22px;
  }

  .stats-row {
    display: flex;
    align-items: center;
    gap: 26px;
    flex-wrap: wrap;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--ink-3);
  }
  .stat-num {
    color: var(--ink);
    font-weight: 700;
    margin-right: 4px;
  }
  .stat-arrow {
    color: var(--accent);
    font-weight: 700;
    margin-right: 4px;
  }
  .stats-row .hint {
    margin: 0 0 0 auto;
    color: var(--ink-3);
    font-family: var(--mono);
    font-size: 14px;
  }

  /* ---------- view toggle ---------- */
  .view-toggle {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: var(--paper-2);
    font-family: var(--mono);
  }
  .view-toggle button {
    background: transparent; border: 0;
    padding: 6px 12px;
    font-size: 12.5px; color: var(--ink-3);
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .15s;
    font-family: inherit; font-weight: 600;
    letter-spacing: .03em;
  }
  .view-toggle button + button { border-left: 1px solid var(--line); }
  .view-toggle button:hover { color: var(--ink-2); }
  .view-toggle button.active {
    background: var(--accent-tint); color: var(--accent-2);
  }
  .view-toggle svg { width: 12px; height: 12px; }

  /* ---------- board ---------- */
  .board-wrap { margin-top: 30px; }
  .board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 84px 36px;
    align-items: start;
  }
  .wires { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: visible; }
  .wire {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-dasharray: 2 7;
    opacity: 0;
  }
  .wire.drawn {
    animation: wire-in .4s ease forwards;
  }
  @keyframes wire-in { to { opacity: .85; } }

  /* ---------- card ---------- */
  .card {
    position: relative; z-index: 1;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 15px 16px 14px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    height: 252px;
    display: flex; flex-direction: column;
  }
  .card:hover, .card.peeking {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 1px 0 #fffefb inset, 0 18px 34px -18px rgba(150,60,20,.4);
    z-index: 50;
  }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .card-top { display: flex; align-items: center; gap: 10px; }
  .card-top .num { margin-left: auto; }
  .num {
    font-size: 14px; font-weight: 700; color: var(--accent);
    background: var(--accent-tint);
    border: 1px solid #e9cdba;
    border-radius: 6px; padding: 2px 7px; letter-spacing: .02em;
    font-family: var(--mono);
  }
  .kicker { font-size: 11.5px; letter-spacing: .14em; color: var(--ink-3); font-weight: 600; font-family: var(--mono); }
  .card-title { font-size: 22px; font-weight: 600; letter-spacing: -0.018em; margin: 22px 0 0; line-height: 1.18; font-family: var(--sans); }
  .card-goal {
    font-size: 16px; color: var(--ink-2); line-height: 1.5;
    margin: 10px 0 0; text-wrap: pretty;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-foot { margin-top: auto; padding-top: 14px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12.5px; color: var(--ink-2);
    background: var(--paper-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 8px; font-weight: 500;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: var(--mono);
  }
  .chip-prompt { color: var(--accent); font-weight: 700; }
  .chip.big { font-size: 14.5px; padding: 6px 11px; }
  .expand { font-size: 12px; color: var(--ink-3); font-weight: 600; white-space: nowrap; transition: color .16s; font-family: var(--mono); }
  .card:hover .expand, .card.peeking .expand { color: var(--accent); }

  /* ---------- peek popover ---------- */
  .peek {
    position: absolute; z-index: 60;
    top: calc(100% + 10px); left: 0; right: 0;
    background: var(--ink); color: #f3ede0;
    border-radius: 10px; padding: 12px 13px;
    box-shadow: 0 18px 40px -14px rgba(20,12,4,.55);
    pointer-events: none;
    animation: pop .14s ease both;
  }
  .peek::before {
    content: ""; position: absolute; top: -6px; left: 26px;
    width: 11px; height: 11px; background: var(--ink);
    transform: rotate(45deg); border-radius: 2px;
  }
  .peek.peek-left::before { left: auto; right: 26px; }
  @keyframes pop { from { opacity: 0; transform: translateY(-5px); } }
  .peek-label { font-size: 10.5px; letter-spacing: .18em; color: #e0a482; font-weight: 700; margin-bottom: 8px; font-family: var(--mono); }
  .peek .pills { gap: 5px; }
  .peek .pill { background: #2c261d; border-color: #3a3328; color: #e8e0d1; }
  .peek-cta { margin-top: 10px; font-size: 11.5px; color: #b3a890; font-family: var(--mono); }

  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    font-size: 12.5px; color: var(--ink-2);
    background: var(--paper-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 10px; font-weight: 500;
    font-family: var(--mono);
  }

  /* ---------- vertical timeline view ---------- */
  .timeline {
    position: relative;
    max-width: 820px;
    margin: 0 auto;
    padding-left: 56px;
  }
  .timeline::before {
    content: ""; position: absolute;
    left: 22px; top: 18px; bottom: 18px;
    width: 2px;
    background: linear-gradient(to bottom,
      var(--line-2) 0%, var(--line-2) 96%, transparent 100%);
    border-radius: 1px;
  }
  .tl-item {
    position: relative;
    margin-bottom: 22px;
  }
  .tl-item:last-child { margin-bottom: 0; }
  .tl-dot {
    position: absolute; left: -49px; top: 14px;
    width: 32px; height: 32px;
    background: var(--card); border: 2px solid var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 12px; font-weight: 700;
    color: var(--accent);
    box-shadow: 0 4px 12px -3px rgba(150,60,20,.3);
    z-index: 2;
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .tl-item:hover .tl-dot {
    transform: scale(1.08);
    box-shadow: 0 6px 18px -3px rgba(150,60,20,.45);
  }
  .tl-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 16px 20px 16px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  .tl-card:hover {
    transform: translateX(4px);
    border-color: var(--accent);
    box-shadow: 0 1px 0 #fffefb inset, 0 18px 34px -18px rgba(150,60,20,.4);
  }
  .tl-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .tl-meta {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11.5px;
    color: var(--ink-3); letter-spacing: .14em; font-weight: 600;
  }
  .tl-sep { opacity: .6; }
  .tl-title {
    font-size: 21px; font-weight: 600; letter-spacing: -0.02em;
    margin: 8px 0 6px; line-height: 1.2;
    font-family: var(--sans);
  }
  .tl-goal {
    font-size: 15px; color: var(--ink-2); line-height: 1.55;
    margin: 0 0 12px; text-wrap: pretty;
  }
  .tl-foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  .tl-pills { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ---------- mermaid diagram container ---------- */
  .diagram {
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px 18px;
    overflow-x: auto;
    text-align: center;
    position: relative;
  }
  .diagram svg { max-width: 100%; height: auto; }
  .diagram-fallback {
    color: var(--ink-3); font-size: 13.5px;
    font-family: var(--mono); padding: 14px;
  }

  .diagram-clickable {
    cursor: zoom-in;
    transition: border-color .15s ease, background-color .15s ease;
  }
  .diagram-clickable:hover {
    border-color: var(--accent);
    background: var(--accent-tint);
  }
  .diagram-clickable::after {
    content: "expand ⤢";
    position: absolute;
    bottom: 8px; right: 12px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-3);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 8px;
    opacity: 0.7;
    transition: opacity .15s ease, color .15s ease, border-color .15s ease;
    pointer-events: none;
  }
  .diagram-clickable:hover::after {
    opacity: 1;
    color: var(--accent);
    border-color: var(--accent);
  }
  .diagram-clickable:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  /* expanded mermaid modal (sits above pane / howTo) */
  .diagram-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(20,12,4,.6);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4vh 4vw;
    animation: pane-fade .15s ease;
  }
  .diagram-modal {
    position: relative;
    width: 100%;
    max-width: 1280px;
    max-height: 92vh;
    background: var(--card);
    border: 1px solid var(--line-2);
    border-radius: 14px;
    padding: 48px 40px 40px;
    overflow: auto;
    box-shadow: 0 40px 100px -30px rgba(20,12,4,.7);
    animation: rise .22s cubic-bezier(.2,.7,.3,1);
  }
  .diagram-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 36px; height: 36px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-2);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    transition: all .15s;
    font-family: var(--mono);
  }
  .diagram-close:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .diagram-large { text-align: center; }
  .diagram-large svg {
    max-width: 100%;
    width: 100%;
    height: auto;
  }

  /* ---------- per-phase icons (Phosphor duotone) + color palette ---------- */
  .phase-icon {
    font-size: 26px;
    line-height: 1;
    color: var(--phase-color, var(--accent));
    user-select: none;
    pointer-events: none;
    opacity: 0.95;
    transition: opacity .15s ease, transform .2s ease;
    flex-shrink: 0;
  }
  .tl-card .phase-icon {
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 30px;
  }
  .card:hover .phase-icon, .tl-card:hover .phase-icon {
    opacity: 1;
    transform: scale(1.08);
  }
  .card[data-phase="1"]  { --phase-color: #c2552b; }
  .card[data-phase="2"]  { --phase-color: #5e8b6e; }
  .card[data-phase="3"]  { --phase-color: #4f7f8a; }
  .card[data-phase="4"]  { --phase-color: #8a5390; }
  .card[data-phase="5"]  { --phase-color: #b08440; }
  .card[data-phase="6"]  { --phase-color: #6c757d; }
  .card[data-phase="7"]  { --phase-color: #d96651; }
  .card[data-phase="8"]  { --phase-color: #6b8f3d; }
  .card[data-phase="9"]  { --phase-color: #2e6f97; }
  .card[data-phase="10"] { --phase-color: #a04a8a; }
  .card[data-phase="11"] { --phase-color: #c69d5e; }
  .card[data-phase="12"] { --phase-color: #3d7f6c; }
  .tl-card[data-phase="1"]  { --phase-color: #c2552b; }
  .tl-card[data-phase="2"]  { --phase-color: #5e8b6e; }
  .tl-card[data-phase="3"]  { --phase-color: #4f7f8a; }
  .tl-card[data-phase="4"]  { --phase-color: #8a5390; }
  .tl-card[data-phase="5"]  { --phase-color: #b08440; }
  .tl-card[data-phase="6"]  { --phase-color: #6c757d; }
  .tl-card[data-phase="7"]  { --phase-color: #d96651; }
  .tl-card[data-phase="8"]  { --phase-color: #6b8f3d; }
  .tl-card[data-phase="9"]  { --phase-color: #2e6f97; }
  .tl-card[data-phase="10"] { --phase-color: #a04a8a; }
  .tl-card[data-phase="11"] { --phase-color: #c69d5e; }
  .tl-card[data-phase="12"] { --phase-color: #3d7f6c; }
  .tl-card { position: relative; }

  /* ---------- right-side slide pane (replaces phase modal) ---------- */
  .pane-backdrop {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(20,12,4,.4);
    backdrop-filter: blur(3px);
    display: flex;
    justify-content: flex-end;
    animation: pane-fade .2s ease;
  }
  @keyframes pane-fade { from { opacity: 0; } }
  .pane {
    position: relative;
    width: 50vw;
    min-width: 520px;
    max-width: 880px;
    height: 100vh;
    background: var(--card);
    border-left: 1px solid var(--line-2);
    padding: 0 48px 70px;
    overflow-y: auto;
    box-shadow: -24px 0 60px -20px rgba(20,12,4,.45);
    animation: pane-slide .28s cubic-bezier(.2,.7,.3,1);
  }

  .pane-bar {
    position: sticky;
    top: 0;
    z-index: 5;
    margin: 0 -48px 22px;
    padding: 14px 20px 14px 24px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .pane-bar-label {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .18em;
    color: var(--ink-3);
  }
  .pane-bar .close {
    position: static;
    top: auto; right: auto;
    flex-shrink: 0;
  }
  .pane[data-phase="1"]  { --phase-color: #c2552b; }
  .pane[data-phase="2"]  { --phase-color: #5e8b6e; }
  .pane[data-phase="3"]  { --phase-color: #4f7f8a; }
  .pane[data-phase="4"]  { --phase-color: #8a5390; }
  .pane[data-phase="5"]  { --phase-color: #b08440; }
  .pane[data-phase="6"]  { --phase-color: #6c757d; }
  .pane[data-phase="7"]  { --phase-color: #d96651; }
  .pane[data-phase="8"]  { --phase-color: #6b8f3d; }
  .pane[data-phase="9"]  { --phase-color: #2e6f97; }
  .pane[data-phase="10"] { --phase-color: #a04a8a; }
  .pane[data-phase="11"] { --phase-color: #c69d5e; }
  .pane[data-phase="12"] { --phase-color: #3d7f6c; }
  .pane .m-head { align-items: flex-start; gap: 16px; }
  .pane .m-head-text { flex: 1; min-width: 0; }
  .pane .m-num { background: var(--phase-color, var(--accent)); box-shadow: 0 6px 16px -6px var(--phase-color, var(--accent)); }
  .pane-icon {
    margin: 4px 0 0 auto;
    font-size: 46px;
    line-height: 1;
    color: var(--phase-color, var(--accent));
    user-select: none;
    flex-shrink: 0;
  }
  @keyframes pane-slide {
    from { transform: translateX(60px); opacity: 0; }
  }

  /* ---------- modal (full-page reader) ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(20,12,4,.55);
    backdrop-filter: blur(6px);
    overflow-y: auto;
    padding: 36px 16px 60px;
    animation: fade .18s ease;
  }
  @keyframes fade { from { opacity: 0; } }
  .modal {
    position: relative;
    width: 100%; max-width: 960px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--line-2);
    border-radius: 14px;
    padding: 56px 60px 70px;
    box-shadow: 0 60px 120px -40px rgba(20,12,4,.7);
    animation: rise .24s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .close {
    position: absolute; top: 18px; right: 18px;
    width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--paper);
    color: var(--ink-2); font-size: 22px; line-height: 1; cursor: pointer;
    transition: all .15s;
    font-family: var(--mono);
  }
  .close:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  .modal.modal-sm { max-width: 560px; padding: 44px 44px 44px; }
  .howto-head { padding-right: 50px; }
  .howto-lede {
    margin: 14px 0 22px;
    font-size: 15px; color: var(--ink-2); line-height: 1.55;
  }
  .howto-tips {
    display: flex; flex-direction: column; gap: 18px;
  }

  .m-head { display: flex; gap: 18px; align-items: center; padding-right: 50px; }
  .m-num {
    font-size: 29px; font-weight: 700; color: #fff; background: var(--accent);
    border-radius: 10px; padding: 8px 14px; letter-spacing: -.01em;
    box-shadow: 0 6px 16px -6px rgba(180,70,30,.7);
    font-family: var(--mono);
  }
  .m-kicker { font-size: 12px; letter-spacing: .16em; color: var(--accent-2); font-weight: 700; font-family: var(--mono); }
  .m-title { font-size: 38px; font-weight: 700; letter-spacing: -.025em; margin: 6px 0 0; line-height: 1.05; font-family: var(--sans); }

  .m-goal {
    margin-top: 26px; font-size: 18px; line-height: 1.55; color: var(--ink);
    background: var(--paper-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px 18px; text-wrap: pretty;
    font-weight: 500;
  }
  .m-tag {
    display: inline-block; font-size: 11.5px; letter-spacing: .14em; font-weight: 700;
    color: var(--accent-2); margin-right: 10px; vertical-align: 2px;
    font-family: var(--mono);
  }

  .m-section { margin-top: 36px; }
  .m-label {
    font-size: 13px; color: var(--accent-2); font-weight: 700;
    margin-bottom: 14px; letter-spacing: .04em;
    font-family: var(--mono);
  }
  .m-h { font-size: 21px; font-weight: 600; margin: 0 0 12px; letter-spacing: -0.015em; font-family: var(--sans); }

  .m-prose { font-size: 16.5px; line-height: 1.65; color: var(--ink-2); text-wrap: pretty; }
  .m-prose p { margin: 0 0 12px; }
  .m-prose p:last-child { margin-bottom: 0; }
  .m-prose strong { color: var(--ink); font-weight: 600; }
  .m-prose em { font-style: italic; color: var(--accent-2); }

  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 13px; }
  .steps li { display: flex; gap: 14px; font-size: 16px; line-height: 1.55; color: var(--ink-2); text-wrap: pretty; }
  .step-n { color: var(--accent); font-weight: 700; flex-shrink: 0; font-size: 14px; padding-top: 2px; min-width: 22px; font-family: var(--mono); }

  .asks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .ask {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 15.5px; color: var(--ink); line-height: 1.5;
  }
  .ask-arrow { color: var(--accent); font-weight: 700; flex-shrink: 0; font-family: var(--mono); }

  .outs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 11px; }
  .outs li { display: flex; gap: 12px; align-items: flex-start; font-size: 15.5px; line-height: 1.55; color: var(--ink-2); }
  .out-check {
    color: var(--accent); font-weight: 700; flex-shrink: 0; font-size: 14px;
    width: 18px; height: 18px; border-radius: 4px;
    background: var(--accent-tint); border: 1px solid #e9cdba;
    display: inline-flex; align-items: center; justify-content: center;
    margin-top: 1px;
    font-family: var(--mono);
  }

  .m-foot {
    margin-top: 44px; padding-top: 28px;
    border-top: 1px dashed var(--line-2);
    display: grid; grid-template-columns: 1fr 1fr; gap: 28px;
  }
  .m-foot h4 { font-size: 13px; color: var(--accent-2); font-weight: 700; margin: 0 0 12px; letter-spacing: .04em; font-family: var(--mono); }
  .m-deliver p { margin: 9px 0 0; font-size: 14.5px; color: var(--ink-2); line-height: 1.55; }

  /* ---------- where to go next ---------- */
  .next {
    margin-top: 64px;
    padding-top: 30px;
    border-top: 1px dashed var(--line-2);
  }
  .next-label {
    font-size: 14px; color: var(--accent-2);
    font-weight: 700; letter-spacing: .04em;
    font-family: var(--mono); margin-bottom: 10px;
  }
  .next-intro {
    font-size: 16px; color: var(--ink-2); line-height: 1.6;
    margin: 0 0 36px; max-width: 64ch;
  }
  .next-sections { display: flex; flex-direction: column; }
  .next-sec {
    padding: 32px 0;
    border-top: 1px solid var(--line);
  }
  .next-sec:first-child { border-top: none; padding-top: 4px; }
  .next-sec-head { margin-bottom: 22px; }
  .next-when {
    display: inline-block;
    font-family: var(--mono);
    font-size: 12px; font-weight: 700;
    letter-spacing: .18em;
    color: var(--accent-2);
    background: var(--accent-tint);
    border: 1px solid #e9cdba;
    border-radius: 6px;
    padding: 4px 10px;
  }
  .next-h {
    font-size: 27px; font-weight: 600;
    letter-spacing: -0.02em;
    margin: 14px 0 8px; line-height: 1.18;
    font-family: var(--sans);
  }
  .next-sec-lede {
    font-size: 15.5px; color: var(--ink-2); line-height: 1.6;
    margin: 0; max-width: 64ch; text-wrap: pretty;
  }
  .next-items {
    list-style: none; padding: 0; margin: 0;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px 36px;
  }
  .next-items li {
    display: flex; gap: 10px;
    font-size: 14.5px; line-height: 1.55;
    align-items: flex-start;
  }
  .next-item-bullet {
    color: var(--accent); flex-shrink: 0;
    font-family: var(--mono); font-weight: 700;
    padding-top: 1px;
  }
  .next-item-body { min-width: 0; }
  .next-item-t { font-weight: 600; color: var(--ink); }
  .next-item-sep { color: var(--ink-3); }
  .next-item-d { color: var(--ink-2); }

  /* ---------- footer tips ---------- */
  .tips {
    margin-top: 64px; padding-top: 30px;
    border-top: 1px dashed var(--line-2);
  }
  .tips-label { font-size: 14px; color: var(--accent-2); font-weight: 700; margin-bottom: 20px; letter-spacing: .04em; font-family: var(--mono); }
  .tips-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px 30px; }
  .tip-k { font-size: 16px; font-weight: 600; color: var(--ink); display: flex; gap: 9px; align-items: baseline; font-family: var(--sans); }
  .tip-bullet { color: var(--accent); font-weight: 700; font-family: var(--mono); }
  .tip-v { font-size: 14.5px; color: var(--ink-2); line-height: 1.6; margin-top: 6px; padding-left: 18px; text-wrap: pretty; }

  /* ---------- responsive ---------- */
  @media (max-width: 939px) {
    .board { grid-template-columns: 1fr !important; gap: 40px 0; max-width: 460px; margin: 0 auto; }
    .card { height: auto; }
    .peek { position: static; margin-top: 12px; }
    .peek::before { display: none; }
    .m-foot { grid-template-columns: 1fr; gap: 22px; }
    .tips-grid { grid-template-columns: 1fr; }
    .next-items { grid-template-columns: 1fr; }
    .modal { padding: 40px 28px 50px; }
    .m-title { font-size: 32px; }
  }
  @media (max-width: 720px) {
    .chrome { padding: 8px 12px; gap: 6px; }
    .chrome-title { margin-left: 4px; font-size: 12.5px; }
    .chrome-meta { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pane-backdrop { background: var(--card); backdrop-filter: none; }
    .pane {
      width: 100vw; min-width: 0; max-width: none;
      height: 100vh;
      padding: 0 22px 60px;
      border-left: none;
      box-shadow: none;
      animation: pane-rise .28s cubic-bezier(.2,.7,.3,1);
    }
    .pane-bar {
      margin: 0 -22px 18px;
      padding: 14px 18px;
      box-shadow: 0 6px 18px -10px rgba(20,12,4,.25);
    }
  }
  @keyframes pane-rise {
    from { transform: translateY(24px); opacity: 0; }
  }
  @media (max-width: 520px) {
    .page { padding: 26px 16px 50px; }
    .hdr-body { padding: 22px 18px 24px; }
    .overlay { padding: 18px 8px 40px; }
    .modal { padding: 36px 22px 44px; border-radius: 12px; }
    .m-head { gap: 14px; padding-right: 40px; }
    .m-num { font-size: 25px; padding: 6px 10px; }
    .m-title { font-size: 27px; }
    .chrome-meta { display: none; }
  }
</style>
