<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The GenAI Learning Path — In Context</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper:   #f1ede2;
    --paper-2: #eae4d6;
    --card:    #fbf9f2;
    --ink:     #1c1813;
    --ink-2:   #57503f;
    --ink-3:   #8c8472;
    --line:    #ddd5c3;
    --line-2:  #cfc6b1;
    --accent:  #c2552b;
    --accent-2:#a8431f;
    --accent-tint: #f4e3d6;
    --shadow: 0 1px 0 #fffefb inset, 0 2px 4px rgba(40,30,15,.05), 0 12px 28px -16px rgba(60,40,20,.18);
    --sans: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    background-image:
      radial-gradient(var(--line-2) 0.6px, transparent 0.6px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  body.modal-open { overflow: hidden; }
  ::selection { background: var(--accent-tint); }

  .mono { font-family: var(--mono); }

  .page { max-width: 1180px; margin: 0 auto; padding: 44px 28px 70px; }

  /* ---------- header actions row (how-to + view toggle) ---------- */
  .hdr-actions { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .howto-btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 11.5px; color: var(--ink-2);
    font-family: var(--mono); font-weight: 600;
    letter-spacing: .03em;
    cursor: pointer;
    transition: all .15s;
  }
  .howto-btn:hover {
    border-color: var(--accent);
    color: var(--accent-2);
    background: var(--accent-tint);
  }
  .howto-btn svg { width: 13px; height: 13px; }

  /* ---------- top back link to In Context ---------- */
  .topback {
    display: inline-flex; align-items: center; gap: 8px;
    text-decoration: none;
    color: var(--ink-3); font-size: 12.5px; font-weight: 600;
    letter-spacing: .02em; margin-bottom: 18px;
    transition: color .15s ease;
    font-family: var(--mono);
  }
  .topback:hover { color: var(--accent); }
  .topback svg { width: 11px; height: 11px; }

  /* ---------- header ---------- */
  .chrome {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    padding: 9px 14px;
    box-shadow: 0 1px 0 #fffefb inset;
    font-family: var(--mono);
  }
  .chrome .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--line-2); display: inline-block; }
  .chrome .dot:first-child { background: #d8855f; }
  .chrome-title { font-size: 12.5px; color: var(--ink-2); margin-left: 8px; font-weight: 500; }
  .chrome-meta { font-size: 12px; color: var(--ink-3); margin-left: auto; }

  .hdr-body {
    background: var(--card); border: 1px solid var(--line); border-top: none;
    border-radius: 0 0 10px 10px;
    padding: 28px 32px 32px;
    box-shadow: var(--shadow);
  }
  .prompt-line { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .prompt-line h1 {
    font-size: clamp(30px, 4.6vw, 50px); margin: 0; font-weight: 700;
    letter-spacing: -0.025em; line-height: 1.02;
    font-family: var(--sans);
  }
  .caret { color: var(--accent); font-weight: 700; font-size: clamp(24px, 4vw, 40px); font-family: var(--mono); }
  .blink { color: var(--accent); animation: blink 1.1s steps(1) infinite; font-size: clamp(22px,3.6vw,38px); transform: translateY(1px); font-family: var(--mono); }
  @keyframes blink { 50% { opacity: 0; } }
  .lede { max-width: 70ch; color: var(--ink-2); font-size: 15.5px; line-height: 1.65; margin: 18px 0 0; }

  .audience {
    display: inline-flex; align-items: center; gap: 12px;
    margin-top: 16px; flex-wrap: wrap;
  }
  .audience-tag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10.5px; font-weight: 700;
    letter-spacing: .16em;
    color: var(--accent-2);
    background: var(--accent-tint);
    border: 1px solid #e9cdba;
    border-radius: 6px;
    padding: 4px 9px;
  }
  .audience-note {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--ink-3);
  }
  .hint { color: var(--ink-3); font-size: 13px; margin: 0; font-family: var(--mono); }

  .hdr-foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-top: 14px;
  }

  /* ---------- view toggle ---------- */
  .view-toggle {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: var(--paper-2);
    font-family: var(--mono);
  }
  .view-toggle button {
    background: transparent; border: 0;
    padding: 6px 12px;
    font-size: 11.5px; color: var(--ink-3);
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .15s;
    font-family: inherit; font-weight: 600;
    letter-spacing: .03em;
  }
  .view-toggle button + button { border-left: 1px solid var(--line); }
  .view-toggle button:hover { color: var(--ink-2); }
  .view-toggle button.active {
    background: var(--accent-tint); color: var(--accent-2);
  }
  .view-toggle svg { width: 12px; height: 12px; }

  /* ---------- board ---------- */
  .board-wrap { margin-top: 30px; }
  .board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 84px 30px;
    align-items: start;
  }
  .wires { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: visible; }
  .wire {
    fill: none; stroke: var(--accent); stroke-width: 2.25;
    stroke-linecap: round;
    opacity: .9;
  }
  .wire.drawn {
    stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: draw .55s cubic-bezier(.65,0,.35,1) forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* ---------- card ---------- */
  .card {
    position: relative; z-index: 1;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 15px 16px 14px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    height: 220px;
    display: flex; flex-direction: column;
  }
  .card:hover, .card.peeking {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 1px 0 #fffefb inset, 0 18px 34px -18px rgba(150,60,20,.4);
    z-index: 50;
  }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .card-top { display: flex; align-items: center; gap: 10px; }
  .num {
    font-size: 13px; font-weight: 700; color: var(--accent);
    background: var(--accent-tint);
    border: 1px solid #e9cdba;
    border-radius: 6px; padding: 2px 7px; letter-spacing: .02em;
    font-family: var(--mono);
  }
  .kicker { font-size: 10.5px; letter-spacing: .14em; color: var(--ink-3); font-weight: 600; font-family: var(--mono); }
  .card-title { font-size: 17.5px; font-weight: 600; letter-spacing: -0.015em; margin: 12px 0 0; line-height: 1.18; font-family: var(--sans); }
  .card-goal {
    font-size: 13.5px; color: var(--ink-2); line-height: 1.5;
    margin: 7px 0 0; text-wrap: pretty;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-foot { margin-top: auto; padding-top: 14px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; color: var(--ink-2);
    background: var(--paper-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 8px; font-weight: 500;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: var(--mono);
  }
  .chip-prompt { color: var(--accent); font-weight: 700; }
  .chip.big { font-size: 13.5px; padding: 6px 11px; }
  .expand { font-size: 11px; color: var(--ink-3); font-weight: 600; white-space: nowrap; transition: color .16s; font-family: var(--mono); }
  .card:hover .expand, .card.peeking .expand { color: var(--accent); }

  /* ---------- peek popover ---------- */
  .peek {
    position: absolute; z-index: 60;
    top: calc(100% + 10px); left: 0; right: 0;
    background: var(--ink); color: #f3ede0;
    border-radius: 10px; padding: 12px 13px;
    box-shadow: 0 18px 40px -14px rgba(20,12,4,.55);
    pointer-events: none;
    animation: pop .14s ease both;
  }
  .peek::before {
    content: ""; position: absolute; top: -6px; left: 26px;
    width: 11px; height: 11px; background: var(--ink);
    transform: rotate(45deg); border-radius: 2px;
  }
  .peek.peek-left::before { left: auto; right: 26px; }
  @keyframes pop { from { opacity: 0; transform: translateY(-5px); } }
  .peek-label { font-size: 9.5px; letter-spacing: .18em; color: #e0a482; font-weight: 700; margin-bottom: 8px; font-family: var(--mono); }
  .peek .pills { gap: 5px; }
  .peek .pill { background: #2c261d; border-color: #3a3328; color: #e8e0d1; }
  .peek-cta { margin-top: 10px; font-size: 10.5px; color: #b3a890; font-family: var(--mono); }

  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    font-size: 11.5px; color: var(--ink-2);
    background: var(--paper-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 10px; font-weight: 500;
    font-family: var(--mono);
  }

  /* ---------- vertical timeline view ---------- */
  .timeline {
    position: relative;
    max-width: 820px;
    margin: 0 auto;
    padding-left: 56px;
  }
  .timeline::before {
    content: ""; position: absolute;
    left: 22px; top: 18px; bottom: 18px;
    width: 2px;
    background: linear-gradient(to bottom,
      var(--line-2) 0%, var(--line-2) 96%, transparent 100%);
    border-radius: 1px;
  }
  .tl-item {
    position: relative;
    margin-bottom: 22px;
  }
  .tl-item:last-child { margin-bottom: 0; }
  .tl-dot {
    position: absolute; left: -49px; top: 14px;
    width: 32px; height: 32px;
    background: var(--card); border: 2px solid var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    color: var(--accent);
    box-shadow: 0 4px 12px -3px rgba(150,60,20,.3);
    z-index: 2;
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .tl-item:hover .tl-dot {
    transform: scale(1.08);
    box-shadow: 0 6px 18px -3px rgba(150,60,20,.45);
  }
  .tl-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 16px 20px 16px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  .tl-card:hover {
    transform: translateX(4px);
    border-color: var(--accent);
    box-shadow: 0 1px 0 #fffefb inset, 0 18px 34px -18px rgba(150,60,20,.4);
  }
  .tl-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .tl-meta {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 10.5px;
    color: var(--ink-3); letter-spacing: .14em; font-weight: 600;
  }
  .tl-sep { opacity: .6; }
  .tl-title {
    font-size: 19px; font-weight: 600; letter-spacing: -0.02em;
    margin: 8px 0 6px; line-height: 1.2;
    font-family: var(--sans);
  }
  .tl-goal {
    font-size: 14px; color: var(--ink-2); line-height: 1.55;
    margin: 0 0 12px; text-wrap: pretty;
  }
  .tl-foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  .tl-pills { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ---------- mermaid diagram container ---------- */
  .diagram {
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px 18px;
    overflow-x: auto;
    text-align: center;
  }
  .diagram svg { max-width: 100%; height: auto; }
  .diagram-fallback {
    color: var(--ink-3); font-size: 12.5px;
    font-family: var(--mono); padding: 14px;
  }

  /* ---------- modal (full-page reader) ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(20,12,4,.55);
    backdrop-filter: blur(6px);
    overflow-y: auto;
    padding: 36px 16px 60px;
    animation: fade .18s ease;
  }
  @keyframes fade { from { opacity: 0; } }
  .modal {
    position: relative;
    width: 100%; max-width: 960px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--line-2);
    border-radius: 14px;
    padding: 56px 60px 70px;
    box-shadow: 0 60px 120px -40px rgba(20,12,4,.7);
    animation: rise .24s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .close {
    position: absolute; top: 18px; right: 18px;
    width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--paper);
    color: var(--ink-2); font-size: 20px; line-height: 1; cursor: pointer;
    transition: all .15s;
    font-family: var(--mono);
  }
  .close:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  .modal.modal-sm { max-width: 560px; padding: 44px 44px 44px; }
  .howto-head { padding-right: 50px; }
  .howto-lede {
    margin: 14px 0 22px;
    font-size: 14px; color: var(--ink-2); line-height: 1.55;
  }
  .howto-tips {
    display: flex; flex-direction: column; gap: 18px;
  }

  .m-head { display: flex; gap: 18px; align-items: center; padding-right: 50px; }
  .m-num {
    font-size: 26px; font-weight: 700; color: #fff; background: var(--accent);
    border-radius: 10px; padding: 8px 14px; letter-spacing: -.01em;
    box-shadow: 0 6px 16px -6px rgba(180,70,30,.7);
    font-family: var(--mono);
  }
  .m-kicker { font-size: 11px; letter-spacing: .16em; color: var(--accent-2); font-weight: 700; font-family: var(--mono); }
  .m-title { font-size: 34px; font-weight: 700; letter-spacing: -.025em; margin: 6px 0 0; line-height: 1.05; font-family: var(--sans); }

  .m-goal {
    margin-top: 26px; font-size: 16.5px; line-height: 1.55; color: var(--ink);
    background: var(--paper-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px 18px; text-wrap: pretty;
    font-weight: 500;
  }
  .m-tag {
    display: inline-block; font-size: 10.5px; letter-spacing: .14em; font-weight: 700;
    color: var(--accent-2); margin-right: 10px; vertical-align: 2px;
    font-family: var(--mono);
  }

  .m-section { margin-top: 36px; }
  .m-label {
    font-size: 12px; color: var(--accent-2); font-weight: 700;
    margin-bottom: 14px; letter-spacing: .04em;
    font-family: var(--mono);
  }
  .m-h { font-size: 19px; font-weight: 600; margin: 0 0 12px; letter-spacing: -0.015em; font-family: var(--sans); }

  .m-prose { font-size: 15.5px; line-height: 1.65; color: var(--ink-2); text-wrap: pretty; }
  .m-prose p { margin: 0 0 12px; }
  .m-prose p:last-child { margin-bottom: 0; }
  .m-prose strong { color: var(--ink); font-weight: 600; }
  .m-prose em { font-style: italic; color: var(--accent-2); }

  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 13px; }
  .steps li { display: flex; gap: 14px; font-size: 15px; line-height: 1.55; color: var(--ink-2); text-wrap: pretty; }
  .step-n { color: var(--accent); font-weight: 700; flex-shrink: 0; font-size: 13px; padding-top: 2px; min-width: 22px; font-family: var(--mono); }

  .asks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .ask {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 14.5px; color: var(--ink); line-height: 1.5;
  }
  .ask-arrow { color: var(--accent); font-weight: 700; flex-shrink: 0; font-family: var(--mono); }

  .outs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 11px; }
  .outs li { display: flex; gap: 12px; align-items: flex-start; font-size: 14.5px; line-height: 1.55; color: var(--ink-2); }
  .out-check {
    color: var(--accent); font-weight: 700; flex-shrink: 0; font-size: 13px;
    width: 18px; height: 18px; border-radius: 4px;
    background: var(--accent-tint); border: 1px solid #e9cdba;
    display: inline-flex; align-items: center; justify-content: center;
    margin-top: 1px;
    font-family: var(--mono);
  }

  .m-foot {
    margin-top: 44px; padding-top: 28px;
    border-top: 1px dashed var(--line-2);
    display: grid; grid-template-columns: 1fr 1fr; gap: 28px;
  }
  .m-foot h4 { font-size: 12px; color: var(--accent-2); font-weight: 700; margin: 0 0 12px; letter-spacing: .04em; font-family: var(--mono); }
  .m-deliver p { margin: 9px 0 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.55; }

  /* ---------- where to go next ---------- */
  .next {
    margin-top: 64px;
    padding-top: 30px;
    border-top: 1px dashed var(--line-2);
  }
  .next-label {
    font-size: 13px; color: var(--accent-2);
    font-weight: 700; letter-spacing: .04em;
    font-family: var(--mono); margin-bottom: 10px;
  }
  .next-intro {
    font-size: 15px; color: var(--ink-2); line-height: 1.6;
    margin: 0 0 36px; max-width: 64ch;
  }
  .next-sections { display: flex; flex-direction: column; }
  .next-sec {
    padding: 32px 0;
    border-top: 1px solid var(--line);
  }
  .next-sec:first-child { border-top: none; padding-top: 4px; }
  .next-sec-head { margin-bottom: 22px; }
  .next-when {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px; font-weight: 700;
    letter-spacing: .18em;
    color: var(--accent-2);
    background: var(--accent-tint);
    border: 1px solid #e9cdba;
    border-radius: 6px;
    padding: 4px 10px;
  }
  .next-h {
    font-size: 24px; font-weight: 600;
    letter-spacing: -0.02em;
    margin: 14px 0 8px; line-height: 1.18;
    font-family: var(--sans);
  }
  .next-sec-lede {
    font-size: 14.5px; color: var(--ink-2); line-height: 1.6;
    margin: 0; max-width: 64ch; text-wrap: pretty;
  }
  .next-items {
    list-style: none; padding: 0; margin: 0;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px 36px;
  }
  .next-items li {
    display: flex; gap: 10px;
    font-size: 13.5px; line-height: 1.55;
    align-items: flex-start;
  }
  .next-item-bullet {
    color: var(--accent); flex-shrink: 0;
    font-family: var(--mono); font-weight: 700;
    padding-top: 1px;
  }
  .next-item-body { min-width: 0; }
  .next-item-t { font-weight: 600; color: var(--ink); }
  .next-item-sep { color: var(--ink-3); }
  .next-item-d { color: var(--ink-2); }

  /* ---------- footer tips ---------- */
  .tips {
    margin-top: 64px; padding-top: 30px;
    border-top: 1px dashed var(--line-2);
  }
  .tips-label { font-size: 13px; color: var(--accent-2); font-weight: 700; margin-bottom: 20px; letter-spacing: .04em; font-family: var(--mono); }
  .tips-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px 30px; }
  .tip-k { font-size: 15px; font-weight: 600; color: var(--ink); display: flex; gap: 9px; align-items: baseline; font-family: var(--sans); }
  .tip-bullet { color: var(--accent); font-weight: 700; font-family: var(--mono); }
  .tip-v { font-size: 13.5px; color: var(--ink-2); line-height: 1.6; margin-top: 6px; padding-left: 18px; text-wrap: pretty; }

  /* ---------- responsive ---------- */
